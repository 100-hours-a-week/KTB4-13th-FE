name: Frontend CI

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  notify-dev-deployment:
    name: Notify Cloud repository for Dev deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.result == 'success'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch Dev deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLOUD_REPO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: '100-hours-a-week',
              repo: 'KTB4-13th-Cloud',
              event_type: 'dev-deploy',
              client_payload: {
                service: 'frontend',
                sha: context.sha,
                repository: context.repo.repo,
              },
            });

  notify-failure:
    name: Notify CI failure
    if: ${{ always() && needs.quality.result == 'failure' }}
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'DISCORD_WEBHOOK_URL secret is not configured; skipping external alert.'
            exit 0
          fi
          payload=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg url "$RUN_URL" \
            '{content: ("🚨 Frontend CI 실패\n저장소: " + $repo + "\n커밋: " + $sha + "\n로그: " + $url)}')
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL"
