name: Frontend CI

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  notify-failure:
    name: Notify CI failure
    if: ${{ always() && needs.quality.result == 'failure' }}
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'DISCORD_WEBHOOK_URL secret is not configured; skipping external alert.'
            exit 0
          fi
          payload=$(jq -n --arg content "🚨 Frontend CI 실패\n저장소: $GITHUB_REPOSITORY\n커밋: $GITHUB_SHA\n로그: $RUN_URL" '{content: $content}')
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL"
